name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npx tsc -p . --noEmit

      - name: Tests
        run: npm test

      - name: Package
        run: |
          npm run compile
          npx --yes @vscode/vsce package --no-dependencies
